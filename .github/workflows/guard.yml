name: Guarded policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  require-base-main:
    name: PR targets main
    runs-on: ubuntu-latest
    steps:
      - name: Require main base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_REF" = main

  guard-shared:
    name: Shared-file ownership
    needs: require-base-main
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require base check
        env:
          BASE_RESULT: ${{ needs.require-base-main.result }}
        run: test "$BASE_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize source policy changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
          INTEGRATION_OWNER: ${{ vars.INTEGRATION_OWNER }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --force origin \
            "refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/merge"
          merge="$(git rev-parse refs/remotes/pull/merge)"
          test "$(git rev-parse "$merge^1")" = "$BASE_SHA"
          test "$(git rev-parse "$merge^2")" = "$HEAD_SHA"
          base_point="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$RUNNER_TEMP/changed"
          git diff --name-only -z --no-renames "$base_point" "$HEAD_SHA" > "$changed"

          bash template/core/files/scripts/authorize-changes.sh --source "$changed"
