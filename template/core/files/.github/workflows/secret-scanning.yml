name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: bash scripts/setup.sh --tool gitleaks
      - name: Scan every commit reachable from the checked-out ref
        run: .agent-rules/tools/gitleaks git --config .gitleaks.toml --no-banner --redact --verbose --log-opts=HEAD .
